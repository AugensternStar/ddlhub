name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked, all extras)
        run: |
          python -m pip install uv
          uv sync --frozen --all-extras
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest -q

  audit:
    # 审计 13：与 test job 同一依赖集（uv.lock --frozen）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked, all extras)
        run: |
          python -m pip install uv
          uv sync --frozen --all-extras
      - name: pip-audit (OSV)
        run: uv run --with pip-audit python -m pip_audit --skip-editable

  smoke-windows:
    # 审计 13：Windows 安装与启动冒烟（msvcrt 锁 / winotify / 迁移）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked, all extras)
        run: |
          python -m pip install uv
          uv sync --frozen --all-extras
      - name: Boot smoke (lock + migrate + scheduler)
        env:
          DDLHUB_DATA_DIR: ./data-smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".venv\Scripts\python" -ArgumentList "-m","ddlhub" -PassThru -RedirectStandardOutput smoke-out.txt
          Start-Sleep -Seconds 20
          $ok = (Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 10).StatusCode
          Stop-Process -Id $p.Id -Force
          if ($ok -ne 200) { throw "boot smoke failed: $ok" }
